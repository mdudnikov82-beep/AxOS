name: AxISA cpu_core.v ASIC Synthesis (OpenLane2 / sky130)

# Step 2 of the AxISA-to-ASIC roadmap - see hardware/axisa_core/asic/
# README.md for full context. Step 1 (openlane-smoke-test.yml) already
# confirmed the OpenLane2/sky130 toolchain stands up cleanly via Nix on
# a GH Actions runner. This pushes AxISA's real cpu_core.v through the
# same flow for the first time - a genuinely new attempt, real errors
# on this first try are expected and should be diagnosed for real
# rather than assumed away.
on:
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix build cache (this project's own GH Actions cache, separate from OpenLane's Cachix)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache the sky130 PDK (volare) - avoid re-hitting GitHub's release API every dispatch
        # A real, repeated failure (not guessed): "403 rate limit exceeded" from
        # https://api.github.com/repos/efabless/volare/releases/... - every
        # dispatch was re-downloading the whole PDK from GitHub's release API
        # with no caching, and enough dispatches in a short window (this
        # bisection) exhausted GitHub's anonymous rate limit. Keyed loosely
        # (not on an exact PDK commit hash, which isn't known ahead of a run) -
        # a stale cache just means volare re-fetches whatever's missing, same
        # as no cache at all, so this can't make a run WORSE, only faster/less
        # rate-limited when it hits.
        uses: actions/cache@v4
        with:
          path: ~/.volare
          key: volare-pdk-sky130-v1

      - name: Show runner resources
        run: |
          df -h .
          free -h

      - name: Generate sw/test1.hex (gitignored - *.hex, must be built fresh)
        working-directory: hardware/axisa_core
        run: |
          python3 sw/asm_test1.py sw/test1.hex
          ls -la sw/test1.hex

      - name: OpenLane2 flow - AxISA cpu_core.v under sky130
        working-directory: hardware/axisa_core/asic
        run: |
          nix run --accept-flake-config \
            github:efabless/openlane2#openlane -- \
            --pdk-root "$HOME/.volare" \
            config.json

      - name: Report power (OpenROAD report_power - first real number, vectorless default activity)
        working-directory: hardware/axisa_core/asic
        run: |
          set -o pipefail
          RUN_DIR=$(ls -td runs/RUN_* | head -1)
          echo "Using run: $RUN_DIR"
          ODB=$(find "$RUN_DIR/final/odb" -name '*.odb' | head -1)
          SDC=$(find "$RUN_DIR/final/sdc" -name '*.sdc' | head -1)
          SPEF=$(find "$RUN_DIR/final/spef" -name '*.spef' | head -1)
          LIB=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd__tt_025C_1v80.lib' | head -1)
          echo "ODB=$ODB"
          echo "SDC=$SDC"
          echo "SPEF=$SPEF"
          echo "LIB=$LIB"
          if [ -z "$ODB" ] || [ -z "$LIB" ]; then
            echo "Could not locate required final views or PDK liberty file - see paths above (empty = not found). Real diagnosis needed, not a guess to paper over."
            exit 1
          fi
          cat > power_report.tcl <<TCL_EOF
          read_lib $LIB
          read_db $ODB
          read_sdc $SDC
          read_spef $SPEF
          report_power
          TCL_EOF
          nix run --accept-flake-config \
            github:efabless/openlane2#openroad -- \
            -exit -no_init power_report.tcl 2>&1 | tee power_report.log
          echo "---"
          tail -40 power_report.log

      - name: Install Icarus Verilog (for real gate-level simulation)
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Real gate-level simulation - generate a workload-driven VCD
        # The vectorless "Report power" step above uses OpenSTA's own
        # generic statistical switching activity, not this core's real
        # program behavior - a real gate-level simulation of the
        # SYNTHESIZED netlist (not RTL - net names must match what
        # OpenSTA loads) gives a genuine, workload-driven VCD instead.
        # Recipe confirmed from OpenSTA's own examples/power_vcd.tcl
        # and community sky130 gate-level-sim practice (not guessed):
        # sky130_fd_sc_hd's behavioral Verilog models need a companion
        # primitives.v (UDP definitions, e.g. udp_pwrgood) to compile
        # under Icarus.
        working-directory: hardware/axisa_core/asic
        run: |
          set -o pipefail
          RUN_DIR=$(ls -td runs/RUN_* | head -1)
          NETLIST=$(find "$RUN_DIR/final/nl" -name '*.v' | head -1)
          PRIMITIVES=$(find "$HOME/.volare" -iname 'primitives.v' -path '*sky130_fd_sc_hd*' | head -1)
          CELLS=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd.v' | head -1)
          echo "NETLIST=$NETLIST"
          echo "PRIMITIVES=$PRIMITIVES"
          echo "CELLS=$CELLS"
          if [ -z "$NETLIST" ] || [ -z "$PRIMITIVES" ] || [ -z "$CELLS" ]; then
            echo "Could not locate the gate-level netlist or PDK Verilog models - see paths above (empty = not found). Real diagnosis needed, not a guess to paper over."
            exit 1
          fi
          iverilog -o gl_power_tb.vvp -g2012 -DFUNCTIONAL -DSIM -DGL -DUNIT_DELAY="#1" \
            "$PRIMITIVES" "$CELLS" "$NETLIST" tb_gatelevel_power.v
          vvp gl_power_tb.vvp | tee gl_power_sim.log
          echo "---"
          tail -20 gl_power_sim.log
          grep -q "ALL AXISA GATE-LEVEL POWER TESTS PASSED" gl_power_sim.log

      - name: Report power (OpenROAD report_power - real workload-driven VCD activity)
        working-directory: hardware/axisa_core/asic
        run: |
          set -o pipefail
          RUN_DIR=$(ls -td runs/RUN_* | head -1)
          NETLIST=$(find "$RUN_DIR/final/nl" -name '*.v' | head -1)
          SDC=$(find "$RUN_DIR/final/sdc" -name '*.sdc' | head -1)
          SPEF=$(find "$RUN_DIR/final/spef" -name '*.spef' | head -1)
          LIB=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd__tt_025C_1v80.lib' | head -1)
          echo "All *.tlef files found under the PDK (diagnostic, in case the exact name guess below is wrong):"
          find "$HOME/.volare" -iname '*.tlef'
          TECH_LEF=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd__nom.tlef' | head -1)
          CELL_LEF=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd.lef' | head -1)
          echo "NETLIST=$NETLIST"
          echo "SDC=$SDC"
          echo "SPEF=$SPEF"
          echo "LIB=$LIB"
          echo "TECH_LEF=$TECH_LEF"
          echo "CELL_LEF=$CELL_LEF"
          if [ -z "$TECH_LEF" ] || [ -z "$CELL_LEF" ]; then
            echo "Could not locate LEF files - see paths above (empty = not found). Real diagnosis needed, not a guess to paper over."
            exit 1
          fi
          cat > power_report_vcd.tcl <<TCL_EOF
          read_lef $TECH_LEF
          read_lef $CELL_LEF
          read_liberty $LIB
          read_verilog $NETLIST
          link_design cpu_core_top
          read_sdc $SDC
          read_spef $SPEF
          read_vcd -scope tb_gatelevel_power/dut gl_power.vcd
          report_power
          TCL_EOF
          nix run --accept-flake-config \
            github:efabless/openlane2#openroad -- \
            -exit -no_init power_report_vcd.tcl 2>&1 | tee power_report_vcd.log
          echo "---"
          tail -60 power_report_vcd.log

      - name: Show disk usage after
        if: always()
        run: |
          df -h .
          du -sh "$HOME/.volare" 2>/dev/null || true
          du -sh /nix/store 2>/dev/null || true

      - name: Upload OpenLane run directory (logs, reports, final views)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axisa-cpu-core-openlane-run
          path: |
            hardware/axisa_core/asic/runs/
            hardware/axisa_core/asic/power_report.log
            hardware/axisa_core/asic/gl_power_sim.log
            hardware/axisa_core/asic/power_report_vcd.log
            hardware/axisa_core/asic/gl_power.vcd
          if-no-files-found: warn
