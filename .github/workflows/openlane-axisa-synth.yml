name: AxISA cpu_core.v ASIC Synthesis (OpenLane2 / sky130)

# Step 2 of the AxISA-to-ASIC roadmap - see hardware/axisa_core/asic/
# README.md for full context. Step 1 (openlane-smoke-test.yml) already
# confirmed the OpenLane2/sky130 toolchain stands up cleanly via Nix on
# a GH Actions runner. This pushes AxISA's real cpu_core.v through the
# same flow for the first time - a genuinely new attempt, real errors
# on this first try are expected and should be diagnosed for real
# rather than assumed away.
on:
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix build cache (this project's own GH Actions cache, separate from OpenLane's Cachix)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Show runner resources
        run: |
          df -h .
          free -h

      - name: Generate sw/test1.hex (gitignored - *.hex, must be built fresh)
        working-directory: hardware/axisa_core
        run: |
          python3 sw/asm_test1.py sw/test1.hex
          ls -la sw/test1.hex

      - name: OpenLane2 flow - AxISA cpu_core.v under sky130
        working-directory: hardware/axisa_core/asic
        run: |
          nix run --accept-flake-config \
            github:efabless/openlane2#openlane -- \
            --pdk-root "$HOME/.volare" \
            config.json

      - name: Report power (OpenROAD report_power - first real number, vectorless default activity)
        working-directory: hardware/axisa_core/asic
        run: |
          set -o pipefail
          RUN_DIR=$(ls -td runs/RUN_* | head -1)
          echo "Using run: $RUN_DIR"
          ODB=$(find "$RUN_DIR/final/odb" -name '*.odb' | head -1)
          SDC=$(find "$RUN_DIR/final/sdc" -name '*.sdc' | head -1)
          SPEF=$(find "$RUN_DIR/final/spef" -name '*.spef' | head -1)
          LIB=$(find "$HOME/.volare" -iname 'sky130_fd_sc_hd__tt_025C_1v80.lib' | head -1)
          echo "ODB=$ODB"
          echo "SDC=$SDC"
          echo "SPEF=$SPEF"
          echo "LIB=$LIB"
          if [ -z "$ODB" ] || [ -z "$LIB" ]; then
            echo "Could not locate required final views or PDK liberty file - see paths above (empty = not found). Real diagnosis needed, not a guess to paper over."
            exit 1
          fi
          cat > power_report.tcl <<TCL_EOF
          read_lib $LIB
          read_db $ODB
          read_sdc $SDC
          read_spef $SPEF
          report_power
          TCL_EOF
          nix run --accept-flake-config \
            github:efabless/openlane2#openroad -- \
            -exit -no_init power_report.tcl 2>&1 | tee power_report.log
          echo "---"
          tail -40 power_report.log

      - name: Show disk usage after
        if: always()
        run: |
          df -h .
          du -sh "$HOME/.volare" 2>/dev/null || true
          du -sh /nix/store 2>/dev/null || true

      - name: Upload OpenLane run directory (logs, reports, final views)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axisa-cpu-core-openlane-run
          path: |
            hardware/axisa_core/asic/runs/
            hardware/axisa_core/asic/power_report.log
          if-no-files-found: warn
