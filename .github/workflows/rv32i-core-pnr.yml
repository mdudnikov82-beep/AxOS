name: RV32I cpu_core.v Real Place-and-Route (Fmax)

# Manual-only (workflow_dispatch). Mirrors axisa-core-pnr.yml - same
# real synth_ecp5 + nextpnr-ecp5 flow, same runner, same fixes already
# learned there (cwd for $readmemh resolution, sw/test1.hex being a
# gitignored *.hex build artifact that must be generated, not assumed
# present). Built to get an Fmax number against AxISA's cpu_core.v (see
# [[project_axisa_synthesis_check]] for that number, 33.02 MHz
# post-route).
#
# TWO separate synth_ecp5 runs, not one - a real bug found the hard way
# (2026-08-15, first dispatch of this workflow): fpga/fpu_blackbox.v's
# (* blackbox *) FPU stand-ins are fine for Yosys's own `stat` cell
# tally (isolates integer-core-only area, same trick
# instr_mem_worstcase.v uses), but nextpnr-ecp5 needs a FULLY CONCRETE
# netlist to place - a true blackbox cell has no primitive definition
# it can place at all, and it errored out ("ERROR: cell type
# 'fp_addsub' is unsupported") without ever reaching placement/timing.
# That first dispatch was wrongly reported "success" by the workflow
# itself too - `nextpnr-ecp5 ... | tee nextpnr.log` without pipefail
# takes tee's (always-0) exit code, not nextpnr's real one, so a hard
# crash silently looked like a clean run. Both fixed here: `set -o
# pipefail` in both synth-adjacent steps, and a second synth pass using
# the REAL rtl/fp_*.v files (not the blackbox) feeding nextpnr - the
# Fmax this produces includes real FPU hardware (AxISA has none), a
# real, disclosed caveat, not a silent one. The FPU-blackboxed synth
# step's own `stat` output is still the honest integer-core-only area
# number to compare against AxISA.
on:
  workflow_dispatch:
    inputs:
      target_freq_mhz:
        description: "Target clock frequency for nextpnr-ecp5 --freq (MHz) - just a constraint to report timing against, not a hard cap on the real Fmax measurement"
        required: true
        default: "50"

jobs:
  pnr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yosys + nextpnr-ecp5 (OSS CAD Suite)
        run: |
          asset_url=$(curl -s https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest | \
            grep browser_download_url | grep linux-x64 | grep -o 'https://[^"]*')
          echo "Downloading: $asset_url"
          curl -L -o /tmp/oss-cad-suite.tgz "$asset_url"
          tar -xzf /tmp/oss-cad-suite.tgz -C /tmp
          echo "/tmp/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Show runner resources
        run: |
          free -h
          nproc

      - name: Generate sw/test1.hex (gitignored - *.hex, must be built fresh)
        working-directory: hardware/rv32i_core
        run: |
          python3 sw/asm_test1.py sw/test1.hex
          ls -la sw/test1.hex

      - name: Yosys synth_ecp5 (FPU blackboxed - honest integer-core-only area, matches AxISA which has no FPU)
        # Run from hardware/rv32i_core (not fpga/) - cpu_core_fpga_top_pnr.v's
        # INSTR_INIT_FILE("sw/test1.hex") is a $readmemh path resolved
        # relative to Yosys's own cwd, not to the .v file it appears in.
        # This JSON is NOT fed to nextpnr (blackbox cells can't be
        # placed) - only used for the `stat` cell tally.
        working-directory: hardware/rv32i_core
        run: |
          set -o pipefail
          yosys -p "read_verilog rtl/alu.v rtl/regfile.v rtl/imm_gen.v rtl/instr_mem.v rtl/data_mem.v rtl/control_unit.v rtl/mmu.v fpga/fpu_blackbox.v rtl/cpu_core.v fpga/cpu_core_fpga_top_pnr.v; synth_ecp5 -top cpu_core_fpga_top -json fpga/cpu_core_areaonly.json" 2>&1 | tee fpga/synth_pnr.log
          echo "---"
          tail -40 fpga/synth_pnr.log
          grep -q "Found and reported 0 problems." fpga/synth_pnr.log

      - name: Yosys synth_ecp5 (real FPU submodules - concrete netlist nextpnr can actually place)
        # Same as above but with the real rtl/fp_*.v files instead of
        # fpga/fpu_blackbox.v - nextpnr-ecp5 needs every cell to have a
        # real primitive definition. The resulting Fmax/utilisation
        # includes real FPU hardware, unlike AxISA (no FPU at all) -
        # disclosed, not silently mixed into the area-only number above.
        working-directory: hardware/rv32i_core
        run: |
          set -o pipefail
          yosys -p "read_verilog rtl/alu.v rtl/regfile.v rtl/imm_gen.v rtl/instr_mem.v rtl/data_mem.v rtl/control_unit.v rtl/mmu.v rtl/fp_regfile.v rtl/fp_addsub.v rtl/fp_mul.v rtl/fp_div.v rtl/fp_sqrt.v rtl/cpu_core.v fpga/cpu_core_fpga_top_pnr.v; synth_ecp5 -top cpu_core_fpga_top -json fpga/cpu_core_pnr.json" 2>&1 | tee fpga/synth_pnr_fullfpu.log
          echo "---"
          tail -40 fpga/synth_pnr_fullfpu.log
          grep -q "Found and reported 0 problems." fpga/synth_pnr_fullfpu.log

      - name: nextpnr-ecp5 place-and-route (real Fmax, full core incl. FPU)
        working-directory: hardware/rv32i_core/fpga
        run: |
          set -o pipefail
          nextpnr-ecp5 --25k --package CABGA381 --json cpu_core_pnr.json \
            --lpf-allow-unconstrained --freq ${{ inputs.target_freq_mhz }} \
            --textcfg cpu_core_pnr.config 2>&1 | tee nextpnr.log
          echo "---"
          tail -60 nextpnr.log
          echo "### Fmax result" >> "$GITHUB_STEP_SUMMARY"
          grep -i "Max frequency" nextpnr.log | tee -a "$GITHUB_STEP_SUMMARY" || echo "(no Max frequency line found - check nextpnr.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PnR logs + artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-cpu-core-pnr
          path: |
            hardware/rv32i_core/fpga/synth_pnr.log
            hardware/rv32i_core/fpga/synth_pnr_fullfpu.log
            hardware/rv32i_core/fpga/nextpnr.log
            hardware/rv32i_core/fpga/cpu_core_areaonly.json
            hardware/rv32i_core/fpga/cpu_core_pnr.json
            hardware/rv32i_core/fpga/cpu_core_pnr.config
          if-no-files-found: ignore
