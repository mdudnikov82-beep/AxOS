name: AxISA NoC Mesh Synthesis Check

# Manual-only (workflow_dispatch) - like axisa-mesh.yml, this compiles
# a generated N-core mesh, except through a real synthesizer (Yosys)
# instead of a simulator (Icarus Verilog). Synthesis is generally
# heavier than simulation for an equivalent design, and this project's
# own bisection already found simulation itself fails past ~4600 cores
# on a standard GitHub-hosted runner - so start SMALL here, don't
# assume the same ceiling applies. See
# [[project_axisa_synthesis_check]] for the single-core synthesizability
# investigation this builds on (found+fixed a real X-optimism trap:
# an empty instr_mem ROM lets the optimizer prove most of the datapath
# "unreachable" - this workflow does NOT fix that per-core, so a
# passing run here confirms STRUCTURAL synthesizability of the whole
# mesh netlist, not a realistic per-core area estimate).
on:
  workflow_dispatch:
    inputs:
      x_size:
        description: "Mesh X size"
        required: true
        default: "8"
      y_size:
        description: "Mesh Y size"
        required: true
        default: "8"
      z_size:
        description: "Mesh Z size"
        required: true
        default: "16"
      worst_case_rom:
        description: "Also run a real ECP5-mapped worst-case-area synth (blackbox instr_mem, no X-optimism collapse) - much heavier, needs this workflow's own runner (no ~25-30min background-task ceiling like a local session has)"
        required: true
        type: boolean
        default: false

jobs:
  synth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yosys (OSS CAD Suite)
        run: |
          asset_url=$(curl -s https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest | \
            grep browser_download_url | grep linux-x64 | grep -o 'https://[^"]*')
          echo "Downloading: $asset_url"
          curl -L -o /tmp/oss-cad-suite.tgz "$asset_url"
          tar -xzf /tmp/oss-cad-suite.tgz -C /tmp
          echo "/tmp/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Show runner resources
        run: |
          free -h
          nproc
          df -h .

      - name: Generate mesh RTL (testbench not needed for synthesis)
        working-directory: hardware/axisa_core
        run: |
          python3 tools/gen_soc_top.py ${{ inputs.x_size }} ${{ inputs.y_size }} ${{ inputs.z_size }} rtl/soc_top.v
          ls -la rtl/soc_top.v

      - name: Yosys generic synthesis check (structural only, no target device)
        working-directory: hardware/axisa_core
        run: |
          yosys -p "read_verilog rtl/alu.v rtl/regbank.v rtl/instr_mem.v rtl/data_mem.v rtl/control_unit.v rtl/mmu.v rtl/cpu_core.v rtl/router.v rtl/noc_core_adapter.v rtl/noc_mem_adapter.v rtl/shared_mem_backing.v rtl/soc_top.v; hierarchy -top soc_top; synth -top soc_top" 2>&1 | tee synth_output.log
          echo "---"
          tail -40 synth_output.log
          grep -q "Found and reported 0 problems." synth_output.log

      - name: Upload synthesis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synth-output-${{ inputs.x_size }}x${{ inputs.y_size }}x${{ inputs.z_size }}
          path: hardware/axisa_core/synth_output.log
          if-no-files-found: ignore

      # Everything below only runs when worst_case_rom is checked - it's
      # a MUCH heavier real ECP5 device-mapped synthesis (not the quick
      # generic structural check above), meant to get an honest worst-
      # case gate count instead of the X-optimism-collapsed one the
      # generic check above is prone to when instr_mem is left empty
      # (see the module header comment and [[project_axisa_synthesis_check]]).
      # Swaps in fpga/instr_mem_worstcase.v ((* blackbox *) stand-in) for
      # rtl/instr_mem.v so the optimizer can't prove the whole datapath
      # "unreachable" for one frozen (non-existent) program. Locally,
      # three attempts at this exact recipe on a 63-core mesh all got
      # killed externally around the 25-30 minute mark (not OOM - system
      # RAM was always healthy at the time) - this workflow's own
      # 300-minute job timeout and dedicated runner sidesteps that
      # entirely, which is the whole reason to run it here instead.

      - name: Yosys worst-case-area synth_ecp5 check (blackbox instr_mem)
        if: ${{ inputs.worst_case_rom }}
        working-directory: hardware/axisa_core
        run: |
          cat > worst_case_synth.ys <<'YS_EOF'
          read_verilog rtl/alu.v rtl/regbank.v fpga/instr_mem_worstcase.v rtl/data_mem.v rtl/control_unit.v rtl/mmu.v rtl/cpu_core.v rtl/router.v rtl/noc_core_adapter.v rtl/noc_mem_adapter.v rtl/shared_mem_backing.v rtl/soc_top.v
          read_verilog -lib -specify +/lattice/cells_sim_ecp5.v +/lattice/cells_bb_ecp5.v
          hierarchy -check -top soc_top

          # coarse (verbatim from synth_lattice's own recipe, EXCEPT
          # `share` - skipped deliberately: its SAT-based resource-
          # sharing analysis blows up combinatorially with multiple
          # router.v instances present at once, crashing (OOM) even on
          # small hand-built tests - see project_axisa_synthesis_check
          # memory)
          proc -latches warn
          check
          flatten
          tribuf -logic
          deminout
          opt_expr
          opt_clean
          check
          opt -nodffe -nosdff
          fsm
          opt
          wreduce
          peepopt
          opt_clean
          techmap -map +/cmp2lut.v -D LUT_WIDTH=4
          opt_expr
          opt_clean
          alumacc
          opt
          memory -nomap
          opt_clean

          memory_libmap -lib +/lattice/lutrams_trellis.txt -lib +/lattice/brams_16kd.txt
          techmap -map +/lattice/lutrams_map_trellis.v -map +/lattice/brams_map_16kd.v

          opt -fast -mux_undef -undriven -fine
          memory_map
          opt -undriven -fine

          techmap -map +/techmap.v -map +/lattice/arith_map_ccu2c.v
          opt -fast

          opt_clean
          dfflegalize -cell $_DFF_?_ 01 -cell $_DFF_?P?_ r -cell $_SDFF_?P?_ r -cell $_DFFE_??_ 01 -cell $_DFFE_?P??_ r -cell $_SDFFE_?P??_ r -cell $_DLATCH_?_ x
          opt_merge
          techmap -D NO_LUT -map +/lattice/cells_map_trellis.v
          opt_expr -undriven -mux_undef
          simplemap
          lattice_gsr
          attrmvcp -copy -attr syn_useioff
          opt_clean

          check -latchonly -assert
          techmap -map +/lattice/latches_map.v
          abc9 -W 300
          clean

          techmap -map +/lattice/cells_map_trellis.v
          opt_lut_ins -tech lattice
          clean

          autoname
          hierarchy -check
          stat
          check -noinit
          blackbox =A:whitebox

          write_json worst_case_synth.json
          YS_EOF
          yosys -s worst_case_synth.ys 2>&1 | tee worst_case_synth.log
          echo "---"
          tail -60 worst_case_synth.log
          grep -q "Found and reported 0 problems." worst_case_synth.log

      - name: Upload worst-case synthesis log + JSON
        if: always() && inputs.worst_case_rom
        uses: actions/upload-artifact@v4
        with:
          name: worst-case-synth-${{ inputs.x_size }}x${{ inputs.y_size }}x${{ inputs.z_size }}
          path: |
            hardware/axisa_core/worst_case_synth.log
            hardware/axisa_core/worst_case_synth.json
          if-no-files-found: ignore
