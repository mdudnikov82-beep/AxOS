name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.bat needs ONE gcc that can target BOTH -m64 (the kernel -
      # KFLAGS - real x86-64 long mode C code) AND -m32 (libaxiom/userspace
      # programs) - see KFLAGS/UFLAGS in build.bat. MSYS2's split mingw32/
      # mingw64 environments are each single-arch only (mingw-w64-i686-gcc
      # was tried here previously - failed with "cc1.exe: sorry,
      # unimplemented: 64-bit mode not compiled in" on the -m64 kernel
      # step, since that package has no 64-bit backend at all). w64devkit
      # (what's actually used for local dev builds, per its own gcc being
      # a full multilib x86_64-w64-mingw32 build) doesn't have this split -
      # fetch the same prebuilt toolchain instead of trying to reassemble
      # an equivalent from MSYS2 packages.
      - name: Install w64devkit (multilib gcc/ld/objcopy - both -m32 and -m64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/skeeto/w64devkit/releases/download/v2.8.0/w64devkit-x64-2.8.0.7z.exe"
          $archive = "$env:RUNNER_TEMP\w64devkit.7z.exe"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # The release asset is a self-extracting 7z archive - just run it
          # directly (-y assume-yes, -o<dest> target dir), no separate 7-Zip
          # install needed. Verified locally: extracts to <dest>\w64devkit\
          # and its gcc.exe genuinely supports both -m64 and -m32 (confirmed
          # by actually compiling a test file both ways before trusting
          # this in CI).
          & $archive -y "-oC:\w64devkit" | Out-Null
          $gcc = Get-ChildItem -Path C:\w64devkit -Recurse -Filter gcc.exe | Select-Object -First 1
          if (-not $gcc) {
            Write-Error "gcc.exe not found anywhere under C:\w64devkit after extraction"
            exit 1
          }
          Write-Host "Found gcc at: $($gcc.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName

      - name: Build AxOS (build.bat)
        shell: cmd
        run: (echo.) | build.bat

      - name: Check kernel.bin fits in 89 boot sectors (<= 45568 bytes)
        shell: pwsh
        run: |
          $size = (Get-Item build\kernel.bin).Length
          Write-Host "kernel.bin size: $size bytes (limit 45568)"
          if ($size -gt 45568) {
            Write-Error "kernel.bin is too big for boot.asm to load (89 sectors = 45568 bytes)"
            exit 1
          }

      - name: Install QEMU
        run: choco install qemu --no-progress -y

      - name: Smoke test in QEMU
        run: python tools\smoke_test.py

      - name: Regression tests in QEMU
        run: python tools\regression_test.py

      - name: ELF loader regression test in QEMU
        run: python tools\exec_regression_test.py

      - name: ai ask regression test in QEMU
        run: python tools\ai_ask_regression_test.py

  build-riscv:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build_riscv.bat expects a prebuilt xPack riscv-none-elf-gcc at a
      # fixed local path (see RISCV_PREFIX) - same toolchain/version/layout
      # used for local dev builds all session, just fetched fresh here
      # instead of relying on a machine-local install.
      - name: Install RISC-V GCC toolchain (xPack riscv-none-elf-gcc 15.2.0-1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-win32-x64.zip"
          $zip = "$env:RUNNER_TEMP\riscv-gcc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Force -Path "C:\axos_build\riscv-gcc" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "C:\axos_build\riscv-gcc" -Force
          $cc = "C:\axos_build\riscv-gcc\xpack-riscv-none-elf-gcc-15.2.0-1\bin\riscv-none-elf-gcc.exe"
          if (-not (Test-Path $cc)) {
            Write-Error "Expected toolchain path not found after extract: $cc"
            exit 1
          }

      - name: Build AxOS RISC-V (build_riscv.bat)
        shell: cmd
        run: build_riscv.bat

      - name: Check RISC-V build artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("rv64build\out\kernel.elf", "rv64build\disk.img")) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing expected build artifact: $f"
              exit 1
            }
            $size = (Get-Item $f).Length
            Write-Host "$f : $size bytes"
          }
