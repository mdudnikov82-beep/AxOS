<h1>Hello from AxOS!</h1>
<p>This page is served by <code>httpsrv.c</code>, a minimal HTTP/1.0
server running on x86-64 long mode, straight from a FAT12 file
(<code>INDEX.HTM</code>) - over a TCP stack written entirely from
scratch on top of a virtio-net-pci driver.</p>
<p>No Linux, no libc, no existing network stack - just this OS.</p>
